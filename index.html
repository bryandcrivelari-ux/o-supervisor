<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="O Supervisor — Supervisão Clínica com IA | Psicologia Insight"/>
<meta name="theme-color" content="#080b0e"/>
<title>O Supervisor — Psicologia Insight</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b0e;--surface:#0e1318;--surface2:#141b23;
  --border:#1f2937;--border2:#1e3a8a;
  --accent:#1e3a8a;--accent-b:#2563eb;--accent-s:#0f172a;
  --accent-g:rgba(37,99,235,0.18);
  --gold:#c9a84c;--gold-s:#2e2308;
  --text:#e5edf7;--text-m:#94a3b8;--text-sub:#64748b;
  --user-bg:#0f1e3d;--success:#3fb950;
  --radius:12px;--shadow:0 8px 40px rgba(0,0,0,0.7);
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Fira Code',monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
#setup-screen{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 30%,#0a1628 0%,#080b0e 70%);display:flex;align-items:center;justify-content:center;padding:24px}
.setup-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:48px 44px;max-width:460px;width:100%;box-shadow:var(--shadow),0 0 60px rgba(37,99,235,0.12);text-align:center}
.setup-brand{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text-m);margin-bottom:8px}
.setup-card h1{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px;color:var(--text)}
.setup-card h1 span{color:var(--accent-b)}
.setup-card>p{color:var(--text-m);font-size:13px;line-height:1.6;margin-bottom:32px}
.setup-label{display:block;text-align:left;font-size:11px;font-weight:600;color:var(--text-m);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.setup-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:border-color .2s;margin-bottom:14px}
.setup-input:focus{border-color:var(--accent-b)}
.setup-input::placeholder{color:var(--text-sub)}
.setup-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;margin-top:6px;font-family:var(--font);letter-spacing:.3px}
.setup-btn:hover{background:#1d4ed8}
.setup-btn:active{transform:scale(.99)}
.setup-err{margin-top:14px;font-size:13px;color:#f87171;min-height:20px}
.setup-footer{margin-top:20px;font-size:11px;color:var(--text-sub);line-height:1.6}
.setup-divider{border:none;border-top:1px solid var(--border);margin:28px 0}
#topbar{flex:0 0 auto;height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px;position:relative;z-index:10}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.topbar-title span{color:var(--accent-b)}
.topbar-sub{font-size:11px;color:var(--text-m);margin-top:1px;letter-spacing:.3px;text-transform:uppercase}
.topbar-spacer{flex:1}
.phase-badge{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;transition:all .4s ease;color:var(--text-m)}
.phase-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--accent-b);animation:pulse 2s infinite}
.phase-badge.phase2{border-color:var(--gold);color:var(--gold)}
.phase-badge.phase2 .dot{background:var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar-btn{background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--text-m);padding:6px 12px;font-size:12px;cursor:pointer;transition:all .2s;font-family:var(--font)}
.topbar-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--accent)}
#main{flex:1 1 0;display:flex;overflow:hidden}
#sidebar{width:255px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.sb-section h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-m);margin-bottom:10px}
.cf{margin-bottom:10px}
.cf label{display:block;font-size:11px;color:var(--text-m);margin-bottom:3px}
.cf input,.cf textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;color:var(--text);font-size:12px;font-family:var(--font);outline:none;resize:none;transition:border-color .2s}
.cf input:focus,.cf textarea:focus{border-color:var(--accent-b)}
.cf input::placeholder,.cf textarea::placeholder{color:var(--text-sub)}
.chk-list{list-style:none}
.chk-list li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-m);padding:4px 0;cursor:pointer;transition:color .2s}
.chk-list li:hover{color:var(--text)}
.chk-icon{width:15px;height:15px;border:1.5px solid var(--border2);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .2s}
.chk-list li.done .chk-icon{background:var(--success);border-color:var(--success);color:#000}
.chk-list li.done{color:var(--text-sub);text-decoration:line-through}
.sb-tips{padding:14px 16px;flex:1;overflow-y:auto}
.tip{background:var(--accent-s);border:1px solid rgba(37,99,235,.2);border-radius:var(--radius);padding:11px;font-size:12px;color:var(--text-m);line-height:1.6;margin-bottom:9px}
.tip strong{color:var(--accent-b);display:block;margin-bottom:3px;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
#chat-area{flex:1 1 0;display:flex;flex-direction:column;overflow:hidden}
#messages{flex:1 1 0;overflow-y:auto;padding:22px 20px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg-row{display:flex;gap:11px;margin-bottom:18px;align-items:flex-start;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.avatar.ai{background:var(--accent-s);border:1px solid var(--border2);filter:drop-shadow(0 0 6px rgba(37,99,235,.3))}
.avatar.user{background:var(--user-bg);border:1px solid var(--border2)}
.bubble{max-width:74%;padding:13px 15px;border-radius:17px;font-size:14px;line-height:1.72}
.msg-row.ai .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:4px;color:var(--text)}
.msg-row.user .bubble{background:var(--user-bg);border:1px solid var(--border2);border-top-right-radius:4px;color:var(--text)}
.bubble h2,.bubble h3{font-size:12px;font-weight:700;color:var(--accent-b);margin:13px 0 5px;text-transform:uppercase;letter-spacing:.5px}
.bubble h2:first-child,.bubble h3:first-child{margin-top:0}
.bubble p{margin-bottom:9px}
.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{padding-left:18px;margin-bottom:9px}
.bubble li{margin-bottom:4px}
.bubble strong{color:#dbeafe;font-weight:600}
.bubble em{color:var(--text-m)}
.bubble hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.bubble code{background:var(--surface2);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:12px;color:var(--gold)}
.bubble.synthesis{border-color:rgba(201,168,76,.25);background:linear-gradient(135deg,var(--surface),#111827)}
.bubble.synthesis h2,.bubble.synthesis h3{color:var(--gold)}
.typing-indicator{display:flex;align-items:center;gap:6px;padding:13px 15px;background:var(--surface);border:1px solid var(--border);border-radius:17px;border-top-left-radius:4px;width:fit-content}
.typing-dot{width:6px;height:6px;background:var(--text-m);border-radius:50%;animation:blink 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.2;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}
